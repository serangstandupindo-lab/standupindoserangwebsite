<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link id="app-icon" rel="icon" type="image/png" href="/assets/images/favicon.png?v=4" />
    <script>
      (() => {
        const path = window.location.pathname;
        const isAdmin = path.startsWith('/admin');
        const isMember = path.startsWith('/member');
        const app = isAdmin
          ? { manifest: '/manifest.admin.webmanifest', icon: '/assets/images/pwa-admin.png' }
          : isMember
            ? { manifest: '/manifest.member.webmanifest', icon: '/assets/images/pwa-member.png' }
            : { manifest: '/manifest.public.webmanifest', icon: '/assets/images/pwa-public.png' };
        const icon = document.getElementById('app-icon');
        if (icon) icon.setAttribute('href', app.icon);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = app.manifest;
        document.head.appendChild(link);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D71920" />
    <title>Standupindo Serang</title>
    <meta name="description" content="Komunitas stand-up comedy di Serang. Ruang untuk tampil, berkarya, dan berkembang bersama. Temukan Open Mic, Event, dan Komika Standupindo Serang." />
    <meta property="og:image" content="/assets/images/pwa-public.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/images/pwa-public.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
